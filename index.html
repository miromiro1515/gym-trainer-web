<body>
<div id="app"><h1>תוכנית מכשירים לחדר כושר חינם</h1><p>אפליקציה חינמית לרישום אימונים וניהול תוכנית אימונים בחדר כושר. מוסיפים מכשירים עם תמונה, קובעים סטים ומשקלים, מסמנים תרגילים שבוצעו ועוקבים אחרי יומן האימונים והגרף השבועי.</p><noscript><p>האפליקציה דורשת הפעלת JavaScript.</p></noscript></div>
<script>
"use strict";
const VERSION="web 1.9";
const BADGE="https://visitor-badge.laobi.icu/badge?page_id=miromiro1515.gym-trainer-web&left_text=%D7%91%D7%99%D7%A7%D7%95%D7%A8%D7%99%D7%9D";
// visit counter: one count per browser, no personal data, refresh does not count again
try{if(!localStorage.getItem("gym.counted")){const c=new Image();c.onload=()=>{try{localStorage.setItem("gym.counted","1")}catch(e){}};c.src=BADGE}}catch(e){}
const CATS=["חזה","גב","כתפיים","ידיים","רגליים","בטן","אירובי","אחר"];
const $app=document.getElementById("app");
const LS=localStorage;
const J=(k,d)=>{try{const v=LS.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const S=(k,v)=>{try{LS.setItem(k,JSON.stringify(v));return true}catch(e){toast("אין מקום באחסון של הדפדפן");return false}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fw=w=>Number.isInteger(w)?String(w):String(w);

let machines=J("gym.machines",null);
let log=J("gym.log",[]);
let workout=J("gym.workout",{active:false,done:{},snap:{}});
let settings=J("gym.settings",{});
try{Object.keys(localStorage).filter(k=>k.startsWith("gym.photoOrig.")).forEach(k=>{localStorage.setItem("gym.photo."+k.slice(14),localStorage.getItem(k));localStorage.removeItem(k)});localStorage.removeItem("gym.bgok")}catch(e){}if(settings.gemKey||settings.gemModel){delete settings.gemKey;delete settings.gemModel;try{localStorage.setItem("gym.settings",JSON.stringify(settings))}catch(e){}}
let seed=[];           // [{id,name,category,image}]
let syncState="";      // status text
let sel=null;          // selected machine id in workout
let editId=null;

function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function modal(title,body,buttons){
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box"><h3>${esc(title)}</h3>${body}<div class="btns"></div></div>`;
  const bx=m.querySelector(".btns");
  buttons.forEach(b=>{const x=document.createElement("button");x.className="btn sm "+(b.cls||"");x.textContent=b.text;x.onclick=()=>{m.remove();b.fn&&b.fn(m)};bx.appendChild(x)});
  document.body.appendChild(m);return m;
}
function confirmDlg(title,msg,okText,fn){modal(title,`<pre>${esc(msg)}</pre>`,[{text:okText,cls:"danger",fn},{text:"ביטול"}])}

// ---------- persistence + sync ----------
function touch(){S("gym.updatedAt",Date.now());schedulePush()}
function saveMachines(){S("gym.machines",machines);touch()}
function saveLog(){S("gym.log",log);touch()}
function saveWorkout(){S("gym.workout",workout)}
function saveSettings(){S("gym.settings",settings)}
function getPhoto(m){
  const p=LS.getItem("gym.photo."+m.id);if(p)return p;
  const s=seed.find(x=>x.id===m.id);return s?("data:image/jpeg;base64,"+s.image):"";
}
function setPhoto(id,data){try{if(data)LS.setItem("gym.photo."+id,data);else{LS.removeItem("gym.photo."+id);LS.removeItem("gym.photoOrig."+id)}}catch(e){toast("אין מקום לתמונה")}}

async function loadSeed(){
  try{const r=await fetch("seed.json",{cache:"no-cache"});seed=(await r.json()).map((x,i)=>({id:"m"+(i+1),...x}))}catch(e){seed=[]}
  if(machines===null){
    machines=seed.map(s=>({id:s.id,name:s.name,sets:3,weight:10,category:s.category||""}));
    machines.push({id:"m9",name:"כיפוף בכיסא רומי",sets:3,weight:0,category:""});
    S("gym.machines",machines);
  }
}
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
function ghCfg(){
  if(!settings.ghToken||!settings.ghRepo)return null;
  return {token:settings.ghToken.trim(),repo:settings.ghRepo.trim(),path:(settings.ghPath||"plan.json").trim()};
}
async function ghReq(method,body){
  const c=ghCfg();
  const r=await fetch(`https://api.github.com/repos/${c.repo}/contents/${c.path}`+(method==="GET"?"?t="+Date.now():""),{
    method,headers:{"Authorization":"Bearer "+c.token,"Accept":"application/vnd.github+json","Content-Type":"application/json"},
    body:body?JSON.stringify(body):undefined});
  return r;
}
function payload(){return {version:1,updatedAt:J("gym.updatedAt",0),machines,log}}
let pushTimer=null,remoteSha=null,pushing=false;
function schedulePush(){
  if(!ghCfg())return;
  clearTimeout(pushTimer);pushTimer=setTimeout(push,2000);
}
async function push(){
  const c=ghCfg();if(!c||pushing)return;
  pushing=true;
  try{
    for(let attempt=0;attempt<2;attempt++){
      const body={message:"עדכון תוכנית אימון",content:b64e(JSON.stringify(payload(),null,1))};
      if(remoteSha)body.sha=remoteSha;
      const r=await ghReq("PUT",body);
      if(r.ok){const j=await r.json();remoteSha=j.content.sha;setSync("☁ נשמר ב-GitHub · "+new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}));break}
      if(r.status===409||r.status===422){await pull(true);continue}
      throw new Error(await ghErr(r));
    }
  }catch(e){setSync("⚠ שמירה ל-GitHub נכשלה: "+e.message)}
  pushing=false;
}
async function ghErr(r){
  if(r.status===401)return "הטוקן לא תקף";
  if(r.status===403)return "אין הרשאה (בדוק שלטוקן יש Contents: Read and write)";
  if(r.status===404)return "המאגר לא נמצא (בדוק שם מאגר והרשאות הטוקן)";
  return "שגיאה "+r.status;
}
async function pull(silent){
  const c=ghCfg();if(!c)return;
  try{
    const r=await ghReq("GET");
    if(r.status===404){remoteSha=null;const t=await fetch(`https://api.github.com/repos/${c.repo}`,{headers:{"Authorization":"Bearer "+c.token}});
      if(t.ok){await push();return}setSync("⚠ "+await ghErr(r));return}
    if(!r.ok){setSync("⚠ "+await ghErr(r));return}
    const j=await r.json();remoteSha=j.sha;
    const rem=JSON.parse(b64d(j.content));
    const localT=J("gym.updatedAt",0);
    // log: union by timestamp, so no workout is ever lost
    const seen=new Set(log.map(e=>e.ts));let added=false;
    (rem.log||[]).forEach(e=>{if(!seen.has(e.ts)){log.push(e);added=true}});
    log.sort((a,b)=>a.ts-b.ts);
    if(rem.updatedAt>localT&&Array.isArray(rem.machines)){machines=rem.machines;S("gym.machines",machines);S("gym.updatedAt",rem.updatedAt)}
    if(added||rem.updatedAt>localT)S("gym.log",log);
    setSync("☁ מסונכרן עם GitHub · "+new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}));
    if(!silent){if(rem.updatedAt<localT||added)schedulePush();render()}
  }catch(e){setSync("⚠ אין חיבור ל-GitHub")}
}
function setSync(t){syncState=t;const el=document.getElementById("syncline");if(el)el.textContent=t}

// ---------- helpers ----------
function weekStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d.getTime()}
function thisWeek(){const ws=weekStart(Date.now());return log.filter(e=>e.ts>=ws).length}
function byId(id){return machines.find(m=>m.id===id)}
function doneCount(){return machines.filter(m=>workout.done[m.id]).length}
function nowLine(){return new Date().toLocaleString("he-IL",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}
function go(h){if(location.hash==="#"+h)render();else location.hash=h}
window.addEventListener("hashchange",render);

// ---------- screens ----------
function render(){
  const h=(location.hash||"#home").slice(1);
  const [scr,arg]=h.split("/");
  if(scr==="machines")return showMachines();
  if(scr==="edit")return showEdit(arg);
  if(scr==="workout")return showWorkout();
  if(scr==="machine")return showSelected(arg);
  if(scr==="log")return showLog();
  if(scr==="settings")return showSettings();
  showHome();
}
function sync(){return `<div class="sync" id="syncline">${esc(syncState)}</div>`}

function showHome(){
  const act=workout.active;
  let h=`<h1 class="c">תוכנית מכשירים לחדר כושר <span style="font-size:12px;font-weight:600;opacity:.75;direction:ltr;display:inline-block;background:#2a2a2a;border-radius:8px;padding:2px 7px;vertical-align:middle">${VERSION}</span></h1><div style="margin-bottom:14px;text-align:center">אימונים השבוע: ${thisWeek()} (סה"כ ${log.length})</div>`;
  if(act)h+=`<button class="btn resume" id="resume">↩ חזרה לאימון הפעיל · ${doneCount()} מתוך ${machines.length} הושלמו</button>`;
  h+=`<div class="tile" id="new"><div class="ic">💪</div><div class="t">אימון חדש</div><div class="s">(${machines.length} מכשירים)</div></div>
  <button class="btn" id="b1">ניהול מכשירים</button><button class="btn" id="b2">יומן אימונים</button>
  <button class="btn" id="b4">הגדרות וסנכרון</button>${sync()}
  <div class="sync">${VERSION}</div>`;
  $app.innerHTML=h;
  if(act)document.getElementById("resume").onclick=()=>go("workout");
  document.getElementById("new").onclick=()=>{
    if(!machines.length){toast("קודם מוסיפים מכשירים");return go("machines")}
    const start=()=>{workout={active:true,done:{},snap:{},started:Date.now()};saveWorkout();go("workout")};
    if(act)confirmDlg("יש אימון פעיל","להתחיל אימון חדש? האימון הפעיל לא יישמר ביומן.","התחל חדש",start);else start();
  };
  document.getElementById("b1").onclick=()=>go("machines");
  document.getElementById("b2").onclick=()=>go("log");
  document.getElementById("b4").onclick=()=>go("settings");
}

function thumb(m){const p=getPhoto(m);return p?`<img src="${p}" alt="">`:`<div class="ph"></div>`}

function showMachines(){
  let h=`<button class="back" id="bk">→ חזרה</button><h1>המכשירים שלי</h1>
  <input type="text" id="nn" placeholder="שם מכשיר חדש"><button class="btn" id="add">הוסף מכשיר</button>`;
  machines.forEach((m,i)=>{
    h+=`<div class="row" data-id="${m.id}">${thumb(m)}<div class="nm" style="touch-action:auto">${esc(m.name)}<div class="meta">${m.sets} סטים · ${fw(m.weight)} ק״ג</div>${m.category?`<span class="cat">${esc(m.category)}</span>`:""}</div></div>`;
  });
  $app.innerHTML=h;
  document.getElementById("bk").onclick=()=>go("home");
  document.getElementById("add").onclick=()=>{
    const v=document.getElementById("nn").value.trim();if(!v)return toast("כתוב שם למכשיר");
    const m={id:uid(),name:v,sets:3,weight:10,category:""};machines.push(m);saveMachines();go("edit/"+m.id);
  };
  $app.querySelectorAll(".row").forEach(r=>r.onclick=e=>{go("edit/"+r.dataset.id)});
  enableDrag();
}
function enableDrag(){
  const rows=[...$app.querySelectorAll(".row")];
  if(rows.length<2){return}
  const hint=document.createElement("div");hint.className="hint";hint.textContent="לחיצה ארוכה על מכשיר ואז גרירה משנה את הסדר.";$app.appendChild(hint);
  let timer=null,drag=null,sx=0,sy=0,suppress=false;
  const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
  rows.forEach(r=>{r.style.touchAction="pan-y";r.style.userSelect="none";r.style.webkitUserSelect="none";r.style.webkitTouchCallout="none";r.oncontextmenu=e=>e.preventDefault()});
  const start=(r,y)=>{
    const rects=rows.map(x=>x.getBoundingClientRect());const from=rows.indexOf(r);
    drag={r,from,to:from,startY:y,rects,h:rects[from].height+parseFloat(getComputedStyle(r).marginBottom||0)+10,scroll0:window.scrollY};
    r.classList.add("lift");r.style.zIndex=5;r.style.position="relative";r.style.transition="none";
    rows.forEach(x=>{if(x!==r)x.style.transition="transform .15s"});
    buzz(25);suppress=true;
  };
  const move=y=>{
    if(!drag)return;
    if(y<60)window.scrollBy(0,-12);else if(y>innerHeight-60)window.scrollBy(0,12);
    const dy=y-drag.startY+(window.scrollY-drag.scroll0);
    drag.r.style.transform=`translateY(${dy}px) scale(1.03)`;
    const c=drag.rects[drag.from].top+drag.rects[drag.from].height/2+dy-0;
    let to=drag.from;
    drag.rects.forEach((q,i)=>{const mid=q.top+q.height/2;if(i<drag.from&&c<mid)to=Math.min(to,i);if(i>drag.from&&c>mid)to=Math.max(to,i)});
    if(to!==drag.to){drag.to=to;buzz(10)}
    rows.forEach((x,i)=>{if(x===drag.r)return;let sh=0;
      if(drag.from<drag.to&&i>drag.from&&i<=drag.to)sh=-drag.h;
      if(drag.from>drag.to&&i<drag.from&&i>=drag.to)sh=drag.h;
      x.style.transform=sh?`translateY(${sh}px)`:""});
  };
  const end=()=>{
    clearTimeout(timer);timer=null;
    if(!drag){return}
    const d=drag;drag=null;
    if(d.to!==d.from){const [m]=machines.splice(d.from,1);machines.splice(d.to,0,m);saveMachines();buzz(15)}
    setTimeout(()=>{suppress=false},350);showMachines();
  };
  rows.forEach(r=>{
    r.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;clearTimeout(timer);timer=setTimeout(()=>start(r,sy),380)},{passive:true});
    r.addEventListener("touchmove",e=>{const t=e.touches[0];
      if(drag){e.preventDefault();move(t.clientY);return}
      if(Math.abs(t.clientX-sx)>8||Math.abs(t.clientY-sy)>8){clearTimeout(timer);timer=null}
    },{passive:false});
    r.addEventListener("touchend",end);r.addEventListener("touchcancel",end);
    r.addEventListener("mousedown",e=>{if(e.button)return;sx=e.clientX;sy=e.clientY;clearTimeout(timer);timer=setTimeout(()=>start(r,sy),380)});
  });
  window.onmousemove=e=>{if(drag)move(e.clientY);else if(timer&&(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)){clearTimeout(timer);timer=null}};
  window.onmouseup=end;
  $app.addEventListener("click",e=>{if(suppress){e.stopPropagation();e.preventDefault()}},true);
}
function move(i,d){const j=i+d;if(j<0||j>=machines.length)return;[machines[i],machines[j]]=[machines[j],machines[i]];saveMachines();showMachines()}

function adjRow(label,id,valFn){return `<div class="adj"><span>${label}</span><button class="minus" data-a="${id}-">−</button><span class="v" id="v-${id}">${valFn()}</span><button class="plus" data-a="${id}+">+</button></div>`}
function bindAdj(m,after){
  const refresh=()=>{document.getElementById("v-sets").textContent=m.sets;document.getElementById("v-w").textContent=fw(m.weight)+" ק״ג"};
  const apply=(a,mult)=>{
    if(a==="sets-")m.sets=Math.max(1,m.sets-1);
    if(a==="sets+")m.sets=Math.min(20,m.sets+1);
    if(a==="w-")m.weight=Math.max(0,Math.round((m.weight-2.5*mult)*10)/10);
    if(a==="w+")m.weight=Math.min(500,Math.round((m.weight+2.5*mult)*10)/10);
    refresh();
  };
  const commit=()=>{saveMachines();after&&after(m)};
  $app.querySelectorAll("[data-a]").forEach(b=>{
    const a=b.dataset.a,isW=a[0]==="w";
    let timer=null,t0=0,held=false;
    const stop=()=>{if(timer){clearTimeout(timer);timer=null}if(held){held=false;commit()}};
    const tick=()=>{
      held=true;const dt=Date.now()-t0;
      const mult=isW?(dt<1500?1:dt<3000?2:dt<4500?4:8):1;
      apply(a,mult);
      timer=setTimeout(tick,isW?(dt<1500?150:100):(dt<1500?260:140));
    };
    b.style.touchAction="manipulation";b.style.userSelect="none";b.style.webkitUserSelect="none";
    b.addEventListener("contextmenu",e=>e.preventDefault());
    b.addEventListener("pointerdown",e=>{
      if(e.button>0)return;e.preventDefault();
      try{b.setPointerCapture(e.pointerId)}catch(_){}
      apply(a,1);commit();t0=Date.now();timer=setTimeout(tick,450);
    });
    ["pointerup","pointercancel","pointerleave","lostpointercapture"].forEach(ev=>b.addEventListener(ev,stop));
    b.addEventListener("click",e=>{if(e.detail===0){apply(a,1);commit()}}); // keyboard activation
  });
}

function showEdit(id){
  const m=byId(id);if(!m)return go("machines");
  const p=getPhoto(m);
  $app.innerHTML=`<button class="back" id="bk">→ חזרה</button><h1>עריכת מכשיר</h1>
  ${p?`<img class="photo" id="ph" src="${p}" alt="${esc(m.name)}">`:""}
  <input type="text" id="nm" value="${esc(m.name)}">
  <select id="cat"><option value="">קבוצת שרירים</option>${CATS.map(c=>`<option ${m.category===c?"selected":""}>${c}</option>`).join("")}</select>
  ${adjRow("סטים","sets",()=>m.sets)}${adjRow("משקל","w",()=>fw(m.weight)+" ק״ג")}
  <input type="file" id="file" accept="image/*" hidden><input type="file" id="cam" accept="image/*" capture="environment" hidden>
  <button class="btn" id="pc">${p?"החלפת תמונה":"הוספת תמונה"} · צילום</button>
  <button class="btn" id="pg">בחירה מהגלריה</button>
  ${p?`<button class="btn warm" id="rp">הסרת תמונה</button>`:""}
  <button class="btn" id="dn">סיום עריכה</button><button class="btn danger" id="del">מחיקת מכשיר</button>
  <div class="hint">התמונות נשמרות רק במכשיר הזה ואינן עולות ל-GitHub.</div>`;
  bindAdj(m);
  const q=s=>document.getElementById(s);
  q("bk").onclick=q("dn").onclick=()=>go("machines");
  q("nm").onchange=()=>{const v=q("nm").value.trim();if(v){m.name=v;saveMachines()}};
  q("cat").onchange=()=>{m.category=q("cat").value;saveMachines()};
  q("pc").onclick=()=>q("cam").click();q("pg").onclick=()=>q("file").click();
  [q("cam"),q("file")].forEach(inp=>inp.onchange=async()=>{const f=inp.files[0];if(!f)return;toast("שומר תמונה…");
    try{const d=await shrink(f,800);setPhoto(m.id,d);LS.removeItem("gym.photoOrig."+m.id);inp.value="";
      render()}catch(e){toast("לא ניתן לקרוא את התמונה")}});
  if(q("rp"))q("rp").onclick=()=>{setPhoto(m.id,"");render()};
  q("del").onclick=()=>confirmDlg("למחוק את המכשיר?","המכשיר והתמונה יימחקו. האימונים שביומן יישמרו.","מחיקה",()=>{
    machines=machines.filter(x=>x.id!==m.id);setPhoto(m.id,"");delete workout.done[m.id];saveWorkout();saveMachines();go("machines")});
}
function shrink(file,max){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const f=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(img.width*f));c.height=Math.max(1,Math.round(img.height*f));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.72))};
  img.onerror=rej;img.src=u})}

function rowHTML(m,i,next){
  const d=!!workout.done[m.id];
  return `<div class="row ${d?"done":""} ${next===m.id?"next":""}" data-id="${m.id}">${thumb(m)}
  <div class="nm" data-id="${m.id}">${esc(m.name)}<div class="meta">${m.sets} סטים · ${fw(workout.snap[m.id]?workout.snap[m.id].weight:m.weight)} ק״ג${d?" · בוצע":""}</div></div>
  <button class="chk" data-chk="${m.id}" aria-label="${d?"בוצע":"סימון כבוצע"}">${d?"✓":""}</button></div>`;
}
function showWorkout(){
  if(!workout.active)return go("home");
  const next=(machines.find(m=>!workout.done[m.id])||{}).id;
  let h=`<button class="back" id="bk">→ יציאה זמנית למסך הראשי (האימון נשמר)</button><h1>אימון נוכחי</h1>
  <div class="sub">${nowLine()}</div>
  <div style="margin:8px 0 6px;color:#5a6c80;font-size:16px">${doneCount()} מתוך ${machines.length} מכשירים הושלמו</div>
  <div class="bar"><i style="width:${machines.length?100*doneCount()/machines.length:0}%"></i></div>
  <div class="hint">↑ החלק את שם המכשיר למעלה (או לחץ ✓) לסימון כבוצע · הקש על המכשיר לפתיחה · מכשיר שבוצע אפשר לפתוח ולעדכן בו משקל</div>`;
  machines.forEach((m,i)=>h+=rowHTML(m,i,next));
  h+=`<button class="btn" id="fin">סיום אימון</button>`;
  $app.innerHTML=h;
  document.getElementById("bk").onclick=()=>go("home");
  $app.querySelectorAll(".row").forEach(r=>r.onclick=e=>{if(e.target.closest(".chk"))return;go("machine/"+r.dataset.id)});
  $app.querySelectorAll("[data-chk]").forEach(b=>b.onclick=e=>{e.stopPropagation();toggleDone(b.dataset.chk)});
  $app.querySelectorAll(".nm").forEach(n=>swipeUp(n,()=>{if(!workout.done[n.dataset.id])toggleDone(n.dataset.id)},()=>go("machine/"+n.dataset.id)));
  document.getElementById("fin").onclick=()=>confirmDlg("לסיים את האימון?",`${doneCount()} מתוך ${machines.length} מכשירים בוצעו. האימון יישמר ביומן עם המכשירים שבוצעו בלבד.`,"סיום ושמירה",finishWorkout);
}
function swipeUp(el,onUp,onTap){
  let x=0,y=0,t=false;
  el.addEventListener("touchstart",e=>{x=e.touches[0].clientX;y=e.touches[0].clientY;t=true},{passive:true});
  el.addEventListener("touchend",e=>{if(!t)return;t=false;const c=e.changedTouches[0],dy=y-c.clientY,dx=Math.abs(c.clientX-x);
    if(dy>=40&&dy>dx*1.3){e.preventDefault();navigator.vibrate&&navigator.vibrate(15);onUp()}
    else if(dx<12&&Math.abs(dy)<12){e.preventDefault();onTap()}});
  el.addEventListener("click",e=>{e.stopPropagation();onTap()});
}
function toggleDone(id){
  const m=byId(id);if(!m)return;
  if(workout.done[id]){delete workout.done[id];delete workout.snap[id]}
  else{workout.done[id]=true;workout.snap[id]={sets:m.sets,weight:m.weight}}
  saveWorkout();
  if(machines.every(x=>workout.done[x.id]))return finishWorkout();
  showWorkout();
}
function showSelected(id){
  const m=byId(id);if(!m||!workout.active)return go("workout");
  const d=!!workout.done[id];
  $app.innerHTML=`<button class="back" id="bk">→ חזרה לרשימת האימון</button><h1>${esc(m.name)}</h1>
  ${getPhoto(m)?`<img class="photo" src="${getPhoto(m)}" alt="${esc(m.name)}">`:""}
  ${d?`<div class="hint" style="font-size:15px">המכשיר סומן כבוצע. אפשר לעדכן משקל וסטים, והשינוי יישמר גם באימון הזה וגם כברירת מחדל לפעם הבאה.</div>`:""}
  ${adjRow("סטים","sets",()=>m.sets)}${adjRow("משקל","w",()=>fw(m.weight)+" ק״ג")}
  ${d?`<button class="btn" id="ok">שמירה וחזרה</button>`:`<button class="btn" id="ok">אישור וסיום מכשיר</button>`}
  ${d?`<button class="btn warm" id="un">ביטול סימון "בוצע"</button>`:""}`;
  bindAdj(m,mm=>{if(workout.done[id]){workout.snap[id]={sets:mm.sets,weight:mm.weight};saveWorkout()}});
  document.getElementById("bk").onclick=()=>go("workout");
  document.getElementById("ok").onclick=()=>{if(d)go("workout");else toggleDone(id)};
  if(d)document.getElementById("un").onclick=()=>{toggleDone(id);go("workout")};
}
function finishWorkout(){
  if(!workout.active)return;
  const items=machines.filter(m=>workout.done[m.id]).map(m=>{const s=workout.snap[m.id]||{sets:m.sets,weight:m.weight};return {name:m.name,sets:s.sets,weight:s.weight}});
  const total=machines.length,n=items.length;
  log.push({ts:Date.now(),machines:items});saveLog();
  workout={active:false,done:{},snap:{}};saveWorkout();
  history.replaceState(null,"","#home");
  $app.innerHTML=`<h1>כל הכבוד! האימון הושלם</h1><p>זהו אימון מספר ${log.length} שלך. בוצעו ${n} מתוך ${total} מכשירים.</p>
  <button class="btn" id="h">חזרה למסך הראשי</button>`;
  document.getElementById("h").onclick=()=>go("home");
}

function showLog(){
  const weeks=8,now=weekStart(Date.now()),wk=7*864e5,counts=[],labels=[];
  for(let w=0;w<weeks;w++){const ws=now-(weeks-1-w)*wk;const d=new Date(ws);labels.push(d.getDate()+"/"+(d.getMonth()+1));
    counts.push(log.filter(e=>weekStart(e.ts)===ws).length)}
  const max=Math.max(1,...counts);
  let svg=`<svg viewBox="0 0 320 170" width="100%" style="direction:ltr;margin:0 0 14px"><line x1="0" y1="140" x2="320" y2="140" stroke="#d6ded8"/>`;
  counts.forEach((c,i)=>{const slot=40,bw=22,x=i*slot+(slot-bw)/2,bh=c/max*110,y=140-bh;
    svg+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="5" fill="${i===weeks-1?"#2e5a4e":"#7aa596"}"/><text x="${i*slot+20}" y="${y-4}" text-anchor="middle" font-size="11" fill="#2e4643">${c}</text><text x="${i*slot+20}" y="158" text-anchor="middle" font-size="9" fill="#78868c">${labels[i]}</text>`});
  svg+="</svg>";
  let h=`<button class="back" id="bk">→ חזרה</button><h1>יומן אימונים</h1><div style="margin-bottom:12px">אימונים השבוע: ${thisWeek()} (סה"כ ${log.length})</div>${svg}
  <div class="hint">הקש על אימון לצפייה בפרטים · ✕ למחיקה</div>`;
  for(let i=log.length-1;i>=0;i--){const e=log[i];
    h+=`<div class="logi" data-i="${i}"><span>${new Date(e.ts).toLocaleString("he-IL",{dateStyle:"short",timeStyle:"short"})} · ${e.machines.length} מכשירים: ${esc(e.machines.map(m=>m.name).join(", "))}</span><button class="x" data-x="${i}" aria-label="מחיקת האימון">✕</button></div>`}
  $app.innerHTML=h;
  document.getElementById("bk").onclick=()=>go("home");
  $app.querySelectorAll(".logi").forEach(r=>r.onclick=e=>{if(e.target.closest(".x"))return;const x=log[+r.dataset.i];
    modal(new Date(x.ts).toLocaleString("he-IL",{dateStyle:"full",timeStyle:"short"}),`<pre>${x.machines.map(m=>`• ${esc(m.name)} — ${m.sets} סטים · ${fw(m.weight)} ק"ג`).join("\n")}</pre>`,[{text:"סגור"}])});
  $app.querySelectorAll("[data-x]").forEach(b=>b.onclick=e=>{e.stopPropagation();const i=+b.dataset.x;
    confirmDlg("למחוק את האימון?","האימון יימחק מהיומן. אי אפשר לשחזר אותו.","מחיקה",()=>{log.splice(i,1);saveLog();showLog()})});
}

// ---------- settings ----------
function showSettings(){
  $app.innerHTML=`<button class="back" id="bk">→ חזרה</button><h1>הגדרות וסנכרון</h1>
  <h3>שמירת התוכנית ב-GitHub</h3>
  <div class="hint">התוכנית (מכשירים, סטים, משקלים ויומן אימונים) נשמרת כקובץ JSON במאגר פרטי בחשבון GitHub שלך, ונטענת מחדש בכל מכשיר. התמונות נשארות רק במכשיר. הטוקן נשמר בדפדפן הזה בלבד.</div>
  <input type="text" id="repo" placeholder="מאגר, לדוגמה: miromiro1515/gym-data" value="${esc(settings.ghRepo||"")}" dir="ltr">
  <input type="text" id="path" placeholder="plan.json" value="${esc(settings.ghPath||"plan.json")}" dir="ltr">
  <input type="password" id="tok" placeholder="${settings.ghToken?"טוקן שמור (הדבק חדש כדי להחליף)":"הדבק טוקן GitHub"}" dir="ltr" autocomplete="off">
  <div class="hint">יצירת טוקן: GitHub ← Settings ← Developer settings ← Fine-grained tokens ← Generate. בחר Only select repositories ובחר רק את מאגר הנתונים, והרשאה Contents: Read and write. עדיף תוקף ארוך.</div>
  <button class="btn" id="save">שמירה וסנכרון עכשיו</button>
  ${settings.ghToken?`<button class="btn warm" id="off">ניתוק GitHub מהמכשיר הזה</button>`:""}
  ${sync()}
  <h3 style="margin-top:26px">גיבוי ידני (בלי GitHub)</h3><div class="hint">אפשר לשלוח את קובץ התוכנית לעצמך בוואטסאפ, ולייבא אותו במכשיר אחר. לא צריך חשבון GitHub.</div>
  <button class="btn" id="shr">שיתוף הגיבוי (וואטסאפ ועוד)</button><button class="btn" id="exp">שמירת קובץ גיבוי במכשיר</button><button class="btn" id="imp">ייבוא מקובץ</button><input type="file" id="impf" accept=".json,application/json" hidden>
  <div class="sync"><img src="${BADGE}&query_only=true" alt="" style="height:20px" onerror="this.style.display='none'"><br>מספר הדפדפנים שנכנסו לאפליקציה (כל דפדפן נספר פעם אחת)</div>
  <div class="sync">${VERSION}</div>`;
  const q=s=>document.getElementById(s);
  q("bk").onclick=()=>go("home");
  q("save").onclick=()=>{
    settings.ghRepo=q("repo").value.trim();settings.ghPath=q("path").value.trim()||"plan.json";
    if(q("tok").value.trim())settings.ghToken=q("tok").value.trim();
    if(!/^[\w.-]+\/[\w.-]+$/.test(settings.ghRepo))return toast("שם מאגר בצורה owner/repo");
    if(!settings.ghToken)return toast("חסר טוקן");
    saveSettings();remoteSha=null;setSync("מסנכרן…");pull(false);
  };
  if(q("off"))q("off").onclick=()=>{delete settings.ghToken;saveSettings();showSettings()};
  q("exp").onclick=()=>{const b=new Blob([JSON.stringify(payload(),null,1)],{type:"application/json"});const a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download="gym-plan-"+new Date().toISOString().slice(0,10)+".json";a.click()};
  q("shr").onclick=async()=>{
    const name="gym-plan-"+new Date().toISOString().slice(0,10)+".json";
    const f=new File([JSON.stringify(payload(),null,1)],name,{type:"application/json"});
    try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"תוכנית אימון"});return}}catch(e){if(e&&e.name==="AbortError")return}
    q("exp").click();toast("השיתוף לא נתמך כאן, הקובץ ירד למכשיר");};
  q("imp").onclick=()=>q("impf").click();
  q("impf").onchange=async()=>{try{const o=JSON.parse(await q("impf").files[0].text());
    if(!Array.isArray(o.machines))throw 0;
    confirmDlg("לייבא את הקובץ?","המכשירים הנוכחיים יוחלפו בקובץ. אימונים מהקובץ יתווספו ליומן.","ייבוא",()=>{
      machines=o.machines;const seen=new Set(log.map(e=>e.ts));(o.log||[]).forEach(e=>{if(!seen.has(e.ts))log.push(e)});log.sort((a,b)=>a.ts-b.ts);
      S("gym.machines",machines);S("gym.log",log);touch();toast("יובא");go("home")})}catch(e){toast("הקובץ לא תקין")}};
}

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
(async function(){
  await loadSeed();
  render();
  if(ghCfg())pull(false);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&ghCfg()&&!pushing)pull(false)});
})();
